<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — AOT Store</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="globals.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 24px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 40px;
    }
    .login-logo .logo { font-family: var(--font-display); font-size: 1.8rem; color: var(--gold); letter-spacing: 0.1em; }
    .login-logo .sub { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }
    .login-card {
      background: var(--gray-dark);
      border: 1px solid var(--gray-mid);
      padding: 32px;
    }
    .login-title { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 24px; letter-spacing: 0.06em; }
    .login-error { background: rgba(192,57,43,0.1); border: 1px solid var(--danger); padding: 12px 16px; font-size: 13px; color: #e74c3c; margin-bottom: 16px; display: none; }
    .login-footer { text-align: center; margin-top: 20px; font-size: 11px; color: var(--text-muted); }
    .hint { margin-top: 24px; padding: 12px; background: rgba(212,175,55,0.05); border: 1px solid rgba(212,175,55,0.15); font-size: 11px; color: var(--text-muted); letter-spacing: 0.04em; }
    .hint strong { color: var(--gold); }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="logo">AOTREVOLUTION</div>
    <div class="sub">Admin Panel</div>
  </div>

  <div class="login-card">
    <h2 class="login-title">Sign In</h2>
    <div class="login-error" id="error-msg"></div>

    <div class="form-group">
      <label class="label">Email</label>
      <input type="email" class="input" id="email" placeholder="admin@aot.store" autocomplete="email">
    </div>

    <div class="form-group">
      <label class="label">Password</label>
      <input type="password" class="input" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="login-btn" onclick="login()">
      Sign In →
    </button>

    <div class="hint">
      <strong>Demo credentials:</strong><br>
      Email: admin@aot.store<br>
      Password: titan2024
    </div>
  </div>

  <div class="login-footer">
    <a href="index.html" style="color:var(--text-muted);">← Back to Store</a>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
<script>
  // Redirect if already logged in
  if (API.getAdmin()) location.href = '/admin-dashboard.html';

  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('error-msg');

    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }

    btn.textContent = 'Signing in...';
    btn.disabled = true;

    const { data, error } = await API.adminLogin(email, password);

    if (error) {
      showError('Invalid email or password. Please try again.');
      btn.textContent = 'Sign In →';
      btn.disabled = false;
    } else {
      btn.textContent = 'Success!';
      setTimeout(() => location.href = '/admin-dashboard.html', 400);
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
