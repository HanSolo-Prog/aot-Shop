<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — AOT Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../styles/globals.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-logo">
      <div class="logo-text">AOT ADMIN</div>
      <div class="logo-sub">Control Panel</div>
    </div>
    <nav>
      <a href="admin-dashboard.html" class="admin-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="admin-products.html" class="admin-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>
        Products
      </a>
      <a href="admin-stock.html" class="admin-nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 1 0 0 7h5a3.5 3.5 0 1 1 0 7H6"/></svg>
        Stock
      </a>
      <a href="admin-orders.html" class="admin-nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Orders
      </a>
      <div style="height:1px;background:var(--gray-mid);margin:16px 0;"></div>
      <a href="index.html" class="admin-nav-item" target="_blank">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        View Store
      </a>
      <button class="admin-nav-item" onclick="API.adminLogout();location.href='admin-login.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Orders</h1>
        <p style="color:var(--text-muted);font-size:13px;margin-top:4px;">Track and manage customer inquiries</p>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openNewOrder()">+ Log Order</button>
    </div>

    <!-- STATUS TABS -->
    <div style="display:flex;gap:0;border-bottom:1px solid var(--gray-mid);margin-bottom:24px;">
      <button class="otab active" onclick="setTab('all',this)" style="padding:10px 20px;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border-bottom:2px solid var(--gold);background:none;">All</button>
      <button class="otab" onclick="setTab('pending',this)" style="padding:10px 20px;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);border-bottom:2px solid transparent;background:none;">Pending</button>
      <button class="otab" onclick="setTab('confirmed',this)" style="padding:10px 20px;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);border-bottom:2px solid transparent;background:none;">Confirmed</button>
      <button class="otab" onclick="setTab('shipped',this)" style="padding:10px 20px;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);border-bottom:2px solid transparent;background:none;">Shipped</button>
      <button class="otab" onclick="setTab('completed',this)" style="padding:10px 20px;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);border-bottom:2px solid transparent;background:none;">Completed</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <tr><td colspan="8"><div class="skeleton" style="height:44px;margin:4px 0;"></div></td></tr>
          <tr><td colspan="8"><div class="skeleton" style="height:44px;margin:4px 0;"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- NEW ORDER MODAL -->
<div class="modal-overlay" id="order-modal" style="display:none;" onclick="if(event.target===this)closeOrderModal()">
  <div class="modal">
    <div class="modal-header">
      <h3>Log New Order</h3>
      <button class="modal-close" onclick="closeOrderModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group full">
        <label class="label">Customer Name *</label>
        <input type="text" class="input" id="o-customer" placeholder="Full name">
      </div>
      <div class="form-group full">
        <label class="label">Facebook Profile (Optional)</label>
        <input type="url" class="input" id="o-fb" placeholder="https://facebook.com/...">
      </div>
      <div class="form-group full">
        <label class="label">Product *</label>
        <select class="input select" id="o-product"></select>
      </div>
      <div class="form-group">
        <label class="label">Quantity</label>
        <input type="number" class="input" id="o-qty" value="1" min="1">
      </div>
      <div class="form-group">
        <label class="label">Status</label>
        <select class="input select" id="o-status">
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="shipped">Shipped</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="form-group full">
        <label class="label">Notes</label>
        <textarea class="input textarea" id="o-notes" rows="2" placeholder="Size, color, special requests..." style="resize:vertical;"></textarea>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:24px;justify-content:flex-end;">
      <button class="btn btn-ghost btn-sm" onclick="closeOrderModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveOrder()">Log Order</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="../config/supabase.js"></script>
<script>
  if (!Utils.requireAdmin()) {}
  let orders = [];
  let products = [];
  let activeTab = 'all';

  async function load() {
    const [ordRes, prodRes] = await Promise.all([API.getOrders(), API.getProducts()]);
    orders = ordRes.data || [];
    products = prodRes.data || [];
    renderTable();
    // Populate product select
    const sel = document.getElementById('o-product');
    sel.innerHTML = products.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  }

  function setTab(tab, el) {
    activeTab = tab;
    document.querySelectorAll('.otab').forEach(t => {
      t.style.color = 'var(--text-muted)';
      t.style.borderBottomColor = 'transparent';
    });
    el.style.color = 'var(--gold)';
    el.style.borderBottomColor = 'var(--gold)';
    renderTable();
  }

  function renderTable() {
    const filtered = activeTab === 'all' ? orders : orders.filter(o => o.status === activeTab);
    const tbody = document.getElementById('orders-tbody');
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state" style="padding:40px;">No orders found</div></td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(o => {
      const sc = Utils.statusColor(o.status);
      return `
        <tr>
          <td><span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);">${o.id}</span></td>
          <td style="font-weight:500;font-size:13px;">${o.customer_name}</td>
          <td style="font-size:12px;max-width:160px;color:var(--text-dim);">${o.product?.name || '—'}</td>
          <td style="font-family:var(--font-mono);font-size:13px;text-align:center;">${o.quantity}</td>
          <td style="font-family:var(--font-mono);color:var(--gold);">${Utils.formatPrice(o.total_price)}</td>
          <td style="font-size:12px;color:var(--text-muted);">${o.order_date}</td>
          <td>
            <select onchange="updateStatus('${o.id}',this.value)" style="background:${sc}22;border:1px solid ${sc}44;color:${sc};padding:4px 8px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;outline:none;cursor:pointer;">
              <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
              <option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option>
              <option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option>
              <option value="completed" ${o.status==='completed'?'selected':''}>Completed</option>
            </select>
          </td>
          <td>
            <div style="font-size:11px;color:var(--text-muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${o.notes}">${o.notes || '—'}</div>
          </td>
        </tr>
      `;
    }).join('');
  }

  async function updateStatus(id, status) {
    await API.updateOrderStatus(id, status);
    const o = orders.find(x => x.id === id);
    if (o) o.status = status;
    Utils.toast(`Order ${id} → ${status}`, 'success');
    renderTable();
  }

  function openNewOrder() { document.getElementById('order-modal').style.display = 'flex'; }
  function closeOrderModal() { document.getElementById('order-modal').style.display = 'none'; }

  function saveOrder() {
    const customer = document.getElementById('o-customer').value.trim();
    const productId = document.getElementById('o-product').value;
    const qty = parseInt(document.getElementById('o-qty').value) || 1;
    const status = document.getElementById('o-status').value;
    const notes = document.getElementById('o-notes').value;
    if (!customer || !productId) { Utils.toast('Customer name and product required.', 'error'); return; }
    const product = products.find(p => p.id === productId);
    const newOrder = {
      id: `ORD-${String(orders.length + 1).padStart(3,'0')}`,
      customer_name: customer,
      product_id: productId,
      product,
      quantity: qty,
      total_price: (product?.price || 0) * qty,
      status,
      notes,
      order_date: new Date().toISOString().split('T')[0],
    };
    orders.unshift(newOrder);
    Utils.toast('Order logged!', 'success');
    closeOrderModal();
    renderTable();
  }

  load();
</script>
</body>
</html>
